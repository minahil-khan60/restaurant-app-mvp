name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          rm -rf www android
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant</title></head><body style="font-family:sans-serif;text-align:center;padding:40px"><h1>Restaurant App MVP</h1><p>APK Working!</p></body></html>' > www/index.html
          echo '{"name":"restaurant-app","version":"1.0.0"}' > package.json
          echo '{"appId":"com.minahil.restaurant","appName":"RestaurantApp","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
