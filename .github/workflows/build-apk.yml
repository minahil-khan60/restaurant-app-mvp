name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix and Create Android
        run: |
          rm -rf android capacitor.config.json
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ ! -f www/index.html ]; then echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Restaurant App</title></head><body><h1>Restaurant App is Running</h1></body></html>' > www/index.html; fi
          ls -la
          ls -la www
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init RestaurantApp com.minahil.restaurant --web-dir=www

      - name: Add Android
        run: |
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
