name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix and Create Android
        run: |
          rm -f capacitor.config.json
          rm -rf android
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.minahil.restaurant","appName":"RestaurantApp","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
          cat capacitor.config.json
          npx cap add android
          ls -la

      - name: Build APK
        run: |
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
